# Whether an instruction count depends on the machine: benches/instructions.rs on several runners, compared. Dispatched
# after a change of the benchmark's allocator, the toolchain, Valgrind or the runner image, since which CPUs a run gets is
# luck and so can't gate a pull request (docs/architecture/testing.md, Instruction counts). Each job has a time limit,
# about twice its slowest successful run among the four runs of 2026-11-03, rounded up to five minutes.
name: instruction determinism
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    name: count (${{ matrix.machine }})
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind && valgrind --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: gungraun-runner@0.20.0
      - run: python3 scripts/instruction-determinism.py run counts-${{ matrix.machine }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: counts-${{ matrix.machine }}
          path: counts-${{ matrix.machine }}.json
          retention-days: 7

  compare:
    needs: count
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: counts
      - run: python3 scripts/instruction-determinism.py compare counts
