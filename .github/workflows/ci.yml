name: CI

# Every push to main runs the Linux checks (`checks`, `heap`, `repo`), EARS' on Linux (`ears`) and the concurrency
# models. A pull request, draft or ready for review, and a dispatch run the fast tier: those, and the binding's suites
# and EARS' on Apple silicon and Windows (platforms.yml, `ears`). The rest of what a pull request ready for review must
# pass, the full tier, is full.yml's: marking a pull request ready starts that workflow and not this one, whose run of
# the same commit goes on, or stands.
# A change to documentation alone runs nothing past `changes`, and a newer push to the same pull request or branch
# cancels the run before it. `ci-pass` is the check a merge waits on, beside full.yml's `full-pass` and mutants.yml's
# `mutants-pass`, for the mutants of a pull request's change.
#
# Every job has a time limit, so one that hangs ends there and not at GitHub's six hours: about twice the job's slowest
# successful run among the 400 workflow runs of 2026-11-03 to 2026-11-11, rounded up to five minutes. A
# platform carries its own among its target's fields, which platforms.yml reads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change holds anything but documentation, which no check reads, and whether it changes the lockfile or
  # `deny.toml`, which the advisories are read against
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      dependencies: ${{ steps.diff.outputs.dependencies }}
    steps:
      # A pull request's merge commit and its first parent, the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE; git fetch --depth=1 origin "$base" 2>/dev/null || base= ;;
            *) base= ;;
          esac
          # A document is a file under docs/ or one ending in .md, but for EARS' API reports, which the EARS job checks
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | sed -E 's#^(packages/ears/etc/[^/]*\.api)\.md$#\1#' | grep -qvE '^docs/|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          # With no base to compare against, as with no documentation to tell apart, everything runs
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -qE '(^|/)Cargo\.(lock|toml)$|^deny\.toml$|^crates/elmdb-node/package\.json$'; then
            echo "dependencies=false" >> "$GITHUB_OUTPUT"
          else
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
          fi

  # The Linux checks, split three ways so they run beside each other: lint and the suites; the heap test and the
  # benchmarks' smoke run; the repository's own checks and the binding
  checks:
    name: checks (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      # rust-toolchain.toml names the toolchain; rustup installs it on first use
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p elmdb -p elmdb-node --all-targets --features elmdb/diagnostics,elmdb-node/diagnostics -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --profile ci
      # The engine's suite with its diagnostics compiled in, and the test of what a collector hears
      - run: cargo nextest run -p elmdb --features diagnostics --profile ci
      - run: cargo test --workspace --doc

  heap:
    name: heap and benchmark smoke (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: maintenance heap assertions and benchmark smoke
        run: |
          set -o pipefail
          cargo test -p elmdb --release --test maintenance_heap -- --ignored --exact maintenance_heap_bounds --nocapture --color never 2>&1 | tee "$RUNNER_TEMP/maintenance-heap.log"
          python3 -c 'import pathlib,sys; assert "test maintenance_heap_bounds ... ok" in pathlib.Path(sys.argv[1]).read_text(), "heap test did not execute"' "$RUNNER_TEMP/maintenance-heap.log"
          cargo bench -p elmdb --bench maintenance -- --test
          cargo bench -p elmdb --bench reads -- --test

  repo:
    name: repository checks and binding (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # The read-only mount check builds offline, so the dependencies are fetched first
      - run: cargo fetch --locked
      - name: refuse unregistered readers on an actual read-only mount
        run: python3 scripts/check-read-only-mount.py
      - name: prove idle snapshot expiry regression rejects indefinite retention
        run: python3 scripts/check-idle-reader-mutation.py
      - name: prove reader recovery assertions reject broken implementations
        run: python3 scripts/check-reader-recovery.py
      - run: cargo xtask check-generated
      - run: cargo xtask check-versions
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo xtask check-notices
      # deny.toml: no banned crate, and none from a git repository or a registry other than crates.io. The checks are
      # named, since a bare `cargo deny check` would also run a license check deny.toml leaves to about.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny check bans sources
      # The RustSec advisories, for a change to the lockfile, a manifest, the binding's targets or deny.toml, whose
      # ignores relax this check. Any other
      # change leaves them to advisories.yml's daily run, so an advisory published today fails no unrelated change
      - if: needs.changes.outputs.dependencies == 'true'
        run: cargo deny check advisories
      - run: cargo xtask check-one-lmdb
      - run: cargo xtask check-exact
      - run: cargo xtask check-diagnostics-off
      - run: cargo xtask check-leiden-serial
      - run: cargo xtask check-sync
      - run: cargo xtask check-commits
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo xtask check-mutant-exclusions
      - name: binding
        run: |
          cargo run -p elmdb --example read-allocations -- --json > "$RUNNER_TEMP/read-allocations.json"
          npm ci
          npm run build:binding
          npm run typecheck:binding
          npm run test:binding
          node crates/elmdb-node/bench/reads.mjs --json --runs 2 > "$RUNNER_TEMP/read-codecs.json"
          python3 -B scripts/test-read-profile.py
          python3 -B scripts/test-mutants-in-diff.py
          python3 scripts/check-read-profile.py --allocations "$RUNNER_TEMP/read-allocations.json" --codecs "$RUNNER_TEMP/read-codecs.json"
          node crates/elmdb-node/bench/against-sqlite.mjs --json --notes 2000 > "$RUNNER_TEMP/against-sqlite.json"
      - name: preserve read measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-profile-smoke
          path: |
            ${{ runner.temp }}/read-allocations.json
            ${{ runner.temp }}/read-codecs.json
            ${{ runner.temp }}/against-sqlite.json
          if-no-files-found: error
      - name: process claim without an account, home directory or proc mount
        run: python3 scripts/check-process-claim-linux.py
      - name: prove kernel-claim and publication fallback assertions fire
        run: python3 scripts/check-process-publication-mutations.py
      - name: the generated loader and declarations are committed
        run: git diff --exit-code -- crates/elmdb-node/index.js crates/elmdb-node/index.d.ts

  # The concurrency models, in every interleaving within the bound (docs/architecture/testing.md, Concurrency models)
  loom:
    name: concurrency models (Loom)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 3
      CARGO_TARGET_DIR: target/loom
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p elmdb --release --lib store::unit_slot::model

  # The same slot and watch delivery under random schedules (docs/architecture/testing.md, Concurrency models)
  shuttle:
    name: concurrency models (Shuttle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTFLAGS: --cfg shuttle
      CARGO_TARGET_DIR: target/shuttle
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p elmdb --release --lib -- store::unit_slot::model store::call_reads::model engine::watch::model engine::builder::model

  platforms:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/platforms.yml
    with:
      targets: >-
        [{"runner":"macos-15","target":"aarch64-apple-darwin","timeout":30},
        {"runner":"windows-latest","target":"x86_64-pc-windows-msvc","timeout":30}]

  # EARS (packages/ears, docs/architecture/ears.md): the binding and EARS' dist built, then EARS' typecheck, its specs,
  # the integration half's consumer compile among them, and its API reports. On Node 24, which vitest needs and the
  # binding job's Node 23 isn't, and in its own job, so the binding's readings stay on the Node they were read on. The
  # fast tier's platforms, as the binding's suites run on them: Linux on every run, Apple silicon and Windows where
  # `platforms` runs, not on a push to main. EARS holds no native code, so the full tier's other targets, Electron and
  # each Node the platforms job loads the binding in reach it only through the binding, which those jobs run. Its time
  # limit is a first guess, about three times the suite's local run, until runs here measure it
  ears:
    name: EARS (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'push'
            && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]'
            || '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # On Windows the binding is built by cargo and named as napi's loader expects, as platforms.yml builds it there
      - name: build the binding and EARS' dist
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build -p elmdb-node --release
            cp target/release/elmdb_node.dll crates/elmdb-node/elmdb.win32-x64-msvc.node
          else
            npm run build:binding
          fi
          npm run build:ears
      - run: npm run typecheck:ears
      # The fast half, then the integration half: the packed package compiled by a consumer on TypeScript 5.7 and the
      # current one, and a language service's completions over it
      - run: npm run test:ears
      - run: npm run api:check -w @elmdb/ears

  # The check a merge waits on: every job above passed or was skipped (a documentation-only change, or the platforms on
  # a push to main). A dispatch reports under another name: it runs the branch's tip and not the merge, on the commit
  # the pull request's run reports on, where its pass would otherwise replace that run's failure
  ci-pass:
    name: ${{ github.event_name != 'workflow_dispatch' && 'ci-pass' || 'CI (dispatched, not a merge gate)' }}
    if: always()
    needs: [changes, checks, heap, repo, loom, shuttle, platforms, ears]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
