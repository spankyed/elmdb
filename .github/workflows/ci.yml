name: CI

# Every push to main runs the Linux checks. Pull requests and a dispatch run the full platform matrix as well: the
# targets the binding ships for (design.md, Packages), each building the binding and running every suite on it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      # rust-toolchain.toml names the toolchain; rustup installs it on first use
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p elmdb -p elmdb-node --all-targets --features elmdb/diagnostics,elmdb-node/diagnostics -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --profile ci
      # The engine's suite with its diagnostics compiled in, and the test of what a collector hears
      - run: cargo nextest run -p elmdb --features diagnostics --profile ci
      - run: cargo test --workspace --doc
      - name: maintenance heap assertions and benchmark smoke
        run: |
          set -o pipefail
          cargo test -p elmdb --release --test maintenance_heap -- --ignored --exact maintenance_heap_bounds --nocapture --color never 2>&1 | tee "$RUNNER_TEMP/maintenance-heap.log"
          python3 -c 'import pathlib,sys; assert "test maintenance_heap_bounds ... ok" in pathlib.Path(sys.argv[1]).read_text(), "heap test did not execute"' "$RUNNER_TEMP/maintenance-heap.log"
          cargo bench -p elmdb --bench maintenance -- --test
          cargo bench -p elmdb --bench reads -- --test
          cargo run -p elmdb --example read-allocations -- --json > "$RUNNER_TEMP/read-allocations.json"
      - name: refuse unregistered readers on an actual read-only mount
        run: python3 scripts/check-read-only-mount.py
      - name: prove idle snapshot expiry regression rejects indefinite retention
        run: python3 scripts/check-idle-reader-mutation.py
      - name: prove reader recovery assertions reject broken implementations
        run: python3 scripts/check-reader-recovery.py
      - run: cargo xtask check-generated
      - run: cargo xtask check-one-lmdb
      - run: cargo xtask check-diagnostics-off
      - name: binding
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test
          node crates/elmdb-node/bench/reads.mjs --json --runs 2 > "$RUNNER_TEMP/read-codecs.json"
          python3 -B scripts/test-read-profile.py
          python3 scripts/check-read-profile.py --allocations "$RUNNER_TEMP/read-allocations.json" --codecs "$RUNNER_TEMP/read-codecs.json"
      - name: preserve read measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-profile-smoke
          path: |
            ${{ runner.temp }}/read-allocations.json
            ${{ runner.temp }}/read-codecs.json
          if-no-files-found: error
      - name: process claim without an account, home directory or proc mount
        run: python3 scripts/check-process-claim-linux.py
      - name: prove kernel-claim and publication fallback assertions fire
        run: python3 scripts/check-process-publication-mutations.py
      - name: the generated loader and declarations are committed
        run: git diff --exit-code -- crates/elmdb-node/index.js crates/elmdb-node/index.d.ts

  # The concurrency models, in every interleaving within the bound (docs/architecture/testing.md, Concurrency models)
  loom:
    name: concurrency models (Loom)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 3
      CARGO_TARGET_DIR: target/loom
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p elmdb --release --lib store::unit_slot::model

  # The same slot and watch delivery under random schedules (docs/architecture/testing.md, Concurrency models)
  shuttle:
    name: concurrency models (Shuttle)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg shuttle
      CARGO_TARGET_DIR: target/shuttle
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p elmdb --release --lib -- store::unit_slot::model engine::watch::model

  # Mutants of what a pull request changes, each crate against its own suite: survivors are reported on their lines and
  # in the summary, not failed on (docs/architecture/testing.md, Mutation testing). On Linux and on Windows, since each
  # compiles code the other doesn't
  mutants:
    name: mutants in the change (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: ubuntu-24.04, python: python3 }
          - { os: Windows, runner: windows-latest, python: python }
    runs-on: ${{ matrix.runner }}
    steps:
      # The merge commit and its first parent, the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - run: ${{ matrix.python }} scripts/mutants-in-diff.py HEAD^1 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-in-diff-${{ matrix.os }}
          path: target/mutants-in-diff
          if-no-files-found: ignore

  # Each benchmarked operation's instructions under Valgrind, on the base and on the change: a count doesn't move with
  # the runner's load, so the step summary shows what the change costs. Reported, never a failure
  instructions:
    name: instruction counts (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The merge commit and its first parent, the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind && valgrind --version
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.20.0
      - run: python3 scripts/instruction-counts.py HEAD^1

  # The same operations' instructions on this commit without the diagnostics feature and with it, nothing collecting:
  # fails when a gated case grows past its declared bound (docs/architecture/testing.md, Diagnostics)
  diagnostics:
    name: diagnostics overhead (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind && valgrind --version
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.20.0
      - run: python3 scripts/diagnostics-overhead.py

  platforms:
    name: ${{ matrix.target }} on Node ${{ matrix.node }}
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, node: '22.17.0' }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, node: '22.17.0' }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, node: '22.17.0' }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, node: '22.17.0' }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, node: '22.17.0' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --profile ci
      # On Windows, @napi-rs/cli 3.10.9's build times out on its own filesystem-reconciliation lock, so the binding
      # is built by cargo and named as napi's loader expects; everywhere else napi builds it
      - name: binding
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build -p elmdb-node --release
            cp target/release/elmdb_node.dll crates/elmdb-node/elmdb.win32-x64-msvc.node
          else
            npm run build
          fi
          npm test
      # Reuse the exact same .node file: an ABI-stable binding must load without recompiling for another runtime.
      - name: record the built binding identity
        shell: bash
        run: |
          node scripts/runtime-binding.cjs record node-floor
          node scripts/check-runtime-binding.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Node 24 loads the existing binding and runs the binding suite
        shell: bash
        run: |
          node scripts/runtime-binding.cjs verify node24
          npm test
      # The app currently pins Electron 37.2.4. This runs Node's test runner inside that Electron executable,
      # not Electron's npm launcher under the setup-node runtime. No app windows or developer profiles are used.
      - name: Electron 37.2.4 loads the existing binding and runs the binding suite
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          npm exec --yes --package=electron@37.2.4 -- electron scripts/runtime-binding.cjs verify electron
          npm exec --yes --package=electron@37.2.4 -- electron --test "crates/elmdb-node/test/**/*.test.mjs"

  # GitHub runs no JavaScript action inside an Alpine container on arm64, so the musl jobs check out on the runner
  # and run every suite in a node:23-alpine container of the runner's own architecture
  musl:
    name: ${{ matrix.target }}
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: every suite, in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w node:23-alpine sh -euc '
            apk add --no-cache bash curl git build-base
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            # The runner builds for its own architecture, where the native gcc links musl binaries
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc
            git config --global --add safe.directory /w
            rustup show active-toolchain
            cargo install --locked cargo-nextest@0.9.148
            cargo nextest run --workspace --profile ci
            npm ci
            npm run build
            npm test
          '
