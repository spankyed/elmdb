name: CI

# Every push to main runs the Linux checks (`checks`, `heap`, `repo`). A draft pull request runs the fast tier: those, and the binding's suites on
# Apple silicon and Windows. A pull request ready for review, and a dispatch, run the full tier: every target the binding
# ships for (design.md, Packages), each building the binding and running every suite on it, and the instruction counts.
# A change to documentation alone runs nothing past `changes`, and a newer push to the same pull request or branch
# cancels the run before it. `ci-pass` is the one check a merge waits on. Mutants of a pull request's change run beside
# this, advisory, in mutants.yml.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change holds anything but documentation, which no check reads, and which tier it runs
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.tier.outputs.full }}
      platforms: ${{ steps.tier.outputs.platforms }}
    steps:
      # A pull request's merge commit and its first parent, the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE; git fetch --depth=1 origin "$base" 2>/dev/null || base= ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # A draft pull request's platforms are the fast tier's; everything else that runs platforms runs all of them
      - id: tier
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          fast='{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          rest='{"runner":"macos-15-intel","target":"x86_64-apple-darwin"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}'
          if [ "$DRAFT" = true ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "platforms=[$fast]" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "platforms=[$fast,$rest]" >> "$GITHUB_OUTPUT"
          fi

  # The Linux checks, split three ways so they run beside each other: lint and the suites; the heap test and the
  # benchmarks' smoke run; the repository's own checks and the binding
  checks:
    name: checks (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      # rust-toolchain.toml names the toolchain; rustup installs it on first use
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p elmdb -p elmdb-node --all-targets --features elmdb/diagnostics,elmdb-node/diagnostics -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --profile ci
      # The engine's suite with its diagnostics compiled in, and the test of what a collector hears
      - run: cargo nextest run -p elmdb --features diagnostics --profile ci
      - run: cargo test --workspace --doc

  heap:
    name: heap and benchmark smoke (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: maintenance heap assertions and benchmark smoke
        run: |
          set -o pipefail
          cargo test -p elmdb --release --test maintenance_heap -- --ignored --exact maintenance_heap_bounds --nocapture --color never 2>&1 | tee "$RUNNER_TEMP/maintenance-heap.log"
          python3 -c 'import pathlib,sys; assert "test maintenance_heap_bounds ... ok" in pathlib.Path(sys.argv[1]).read_text(), "heap test did not execute"' "$RUNNER_TEMP/maintenance-heap.log"
          cargo bench -p elmdb --bench maintenance -- --test
          cargo bench -p elmdb --bench reads -- --test

  repo:
    name: repository checks and binding (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # The read-only mount check builds offline, so the dependencies are fetched first
      - run: cargo fetch --locked
      - name: refuse unregistered readers on an actual read-only mount
        run: python3 scripts/check-read-only-mount.py
      - name: prove idle snapshot expiry regression rejects indefinite retention
        run: python3 scripts/check-idle-reader-mutation.py
      - name: prove reader recovery assertions reject broken implementations
        run: python3 scripts/check-reader-recovery.py
      - run: cargo xtask check-generated
      - run: cargo xtask check-one-lmdb
      - run: cargo xtask check-diagnostics-off
      - run: cargo xtask check-leiden-serial
      - run: cargo xtask check-sync
      - name: binding
        run: |
          cargo run -p elmdb --example read-allocations -- --json > "$RUNNER_TEMP/read-allocations.json"
          npm ci
          npm run build
          npm run typecheck
          npm test
          node crates/elmdb-node/bench/reads.mjs --json --runs 2 > "$RUNNER_TEMP/read-codecs.json"
          python3 -B scripts/test-read-profile.py
          python3 scripts/check-read-profile.py --allocations "$RUNNER_TEMP/read-allocations.json" --codecs "$RUNNER_TEMP/read-codecs.json"
      - name: preserve read measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-profile-smoke
          path: |
            ${{ runner.temp }}/read-allocations.json
            ${{ runner.temp }}/read-codecs.json
          if-no-files-found: error
      - name: process claim without an account, home directory or proc mount
        run: python3 scripts/check-process-claim-linux.py
      - name: prove kernel-claim and publication fallback assertions fire
        run: python3 scripts/check-process-publication-mutations.py
      - name: the generated loader and declarations are committed
        run: git diff --exit-code -- crates/elmdb-node/index.js crates/elmdb-node/index.d.ts

  # The concurrency models, in every interleaving within the bound (docs/architecture/testing.md, Concurrency models)
  loom:
    name: concurrency models (Loom)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 3
      CARGO_TARGET_DIR: target/loom
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p elmdb --release --lib store::unit_slot::model

  # The same slot and watch delivery under random schedules (docs/architecture/testing.md, Concurrency models)
  shuttle:
    name: concurrency models (Shuttle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg shuttle
      CARGO_TARGET_DIR: target/shuttle
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p elmdb --release --lib -- store::unit_slot::model engine::watch::model

  # Each benchmarked operation's instructions under Valgrind, on the base and on the change: a count doesn't move with
  # the runner's load, so the step summary shows what the change costs. Reported, never a failure
  instructions:
    name: instruction counts (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The merge commit and its first parent, the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind && valgrind --version
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.20.0
      - run: python3 scripts/instruction-counts.py HEAD^1
        env:
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
      # What Valgrind wrote, the callgrind files of a run that measured nothing among them, kept when the step fails
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: instruction-counts-gungraun
          path: ${{ runner.temp }}/gungraun
          if-no-files-found: ignore

  # The same operations' instructions on this commit without the diagnostics feature and with it, nothing collecting:
  # fails when a gated case grows past its declared bound (docs/architecture/testing.md, Diagnostics)
  diagnostics:
    name: diagnostics overhead (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind && valgrind --version
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.20.0
      - run: python3 scripts/diagnostics-overhead.py
        env:
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
      # What Valgrind wrote, the callgrind files of a run that measured nothing among them, kept when the step fails
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-overhead-gungraun
          path: ${{ runner.temp }}/gungraun
          if-no-files-found: ignore

  platforms:
    name: ${{ matrix.target }} on Node 22.17.0
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --profile ci
      # On Windows, @napi-rs/cli 3.10.9's build times out on its own filesystem-reconciliation lock, so the binding
      # is built by cargo and named as napi's loader expects; everywhere else napi builds it
      - name: binding
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build -p elmdb-node --release
            cp target/release/elmdb_node.dll crates/elmdb-node/elmdb.win32-x64-msvc.node
          else
            npm run build
          fi
          npm test
      # Reuse the exact same .node file: an ABI-stable binding must load without recompiling for another runtime.
      - name: record the built binding identity
        shell: bash
        run: |
          node scripts/runtime-binding.cjs record node-floor
          node scripts/check-runtime-binding.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Node 24 loads the existing binding and runs the binding suite
        shell: bash
        run: |
          node scripts/runtime-binding.cjs verify node24
          npm test
      # The app currently pins Electron 37.2.4. This runs Node's test runner inside that Electron executable,
      # not Electron's npm launcher under the setup-node runtime. No app windows or developer profiles are used.
      - name: Electron 37.2.4 loads the existing binding and runs the binding suite
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          npm exec --yes --package=electron@37.2.4 -- electron scripts/runtime-binding.cjs verify electron
          npm exec --yes --package=electron@37.2.4 -- electron --test "crates/elmdb-node/test/**/*.test.mjs"

  # GitHub runs no JavaScript action inside an Alpine container on arm64, so the musl jobs check out on the runner
  # and run every suite in a node:23-alpine container of the runner's own architecture. The toolchain, the registry and
  # the build are cached on the runner and mounted in, and nextest is its released musl binary, checked against the
  # release's own checksum
  musl:
    name: ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            nextest-sha256: bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            nextest-sha256: 94676506ceaed01746d78cfe9ed124ee841b2932fd18d9d10f438a347bd9ba5e
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/musl-cache
            target
          key: musl-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: musl-${{ matrix.target }}-
      - name: every suite, in Alpine
        env:
          TARGET: ${{ matrix.target }}
          NEXTEST_SHA256: ${{ matrix.nextest-sha256 }}
        run: |
          cache=$RUNNER_TEMP/musl-cache
          mkdir -p "$cache/rustup" "$cache/registry" "$cache/git"
          docker run --rm -v "$PWD:/w" -w /w \
            -v "$cache/rustup:/root/.rustup" \
            -v "$cache/registry:/root/.cargo/registry" \
            -v "$cache/git:/root/.cargo/git" \
            -e TARGET -e NEXTEST_SHA256 -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR \
            node:23-alpine sh -euc '
            apk add --no-cache bash curl git build-base
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            # The runner builds for its own architecture, where the native gcc links musl binaries
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc
            git config --global --add safe.directory /w
            rustup show active-toolchain
            archive=cargo-nextest-0.9.148-$TARGET.tar.gz
            curl --proto "=https" --tlsv1.2 -sSfLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/$archive"
            echo "$NEXTEST_SHA256  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$HOME/.cargo/bin" && rm "$archive"
            cargo nextest run --workspace --profile ci
            npm ci
            npm run build
            npm test
          '
          # The container writes as root; the cache is saved by the runner's user
          sudo chown -R "$(id -u):$(id -g)" "$cache" target

  # The one check a merge waits on: every job above passed or was skipped (a documentation-only change, or the full
  # tier's jobs on a draft)
  ci-pass:
    if: always()
    needs: [changes, checks, heap, repo, loom, shuttle, instructions, diagnostics, platforms, musl]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
