# Fails, which mails whoever maintains this, when a crate in the lockfile has a RustSec advisory deny.toml doesn't
# ignore, or the workspace's root package-lock.json (the build and test tooling) has an npm advisory of high severity
# or above. Both `elmdb` and `@elmdb/ears` have zero third-party runtime dependencies (`elmdb` only names its platform
# binary optional dependencies). An advisory appears with no change here, so this
# reads both each day on main and runs `npm audit` on pull requests that change `package-lock.json`; ci.yml reads the
# RustSec ones for a pull request that changes the Rust lockfile or deny.toml.
name: advisories
on:
  schedule:
    - cron: '0 7 * * *'
  pull_request:
    paths:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    # A prebuilt cargo-deny, the advisory database's clone and cargo's metadata, then one request to npm's registry: a
    # few minutes at most
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - if: github.event_name != 'pull_request'
        run: rustup show active-toolchain
      - if: github.event_name != 'pull_request'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny@0.21.0
      - if: github.event_name != 'pull_request'
        run: cargo deny check advisories
      # After a RustSec failure too, so one run says everything there is to answer
      - if: always() && !cancelled()
        run: npm audit --audit-level=high
