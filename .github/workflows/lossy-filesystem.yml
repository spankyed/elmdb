# The engine over a filesystem that loses what wasn't synced (docs/roadmap/synced-commit.md, phase 5): LazyFS keeps what
# a process writes in a cache of its own until it is synced, and drops it on a command, as a power loss would. A writer
# dies part way through its syncs, what it didn't sync is dropped, and the database opened after must hold what its last
# finished sync held (engine/tests/power_loss.rs, a_filesystem_that_drops_what_was_not_synced_...). Run again with the
# writer's pin turned off, the test must fail: so each run shows it can. Then LazyFS tears a write in the middle, part of
# it persisted, and crashes, and the same holds (a_filesystem_that_tears_a_write_...). Each night, on a dispatch, and on
# a pull request that changes this job or the test it runs.
name: lossy filesystem

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/lossy-filesystem.yml
      - crates/elmdb/tests/power_loss.rs

permissions:
  contents: read

jobs:
  lossy:
    name: a filesystem that drops what wasn't synced, and tears a write (LazyFS)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # LazyFS at a commit read before it was pinned (2026-11-12)
      LAZYFS_COMMIT: 3edad01aa936b81fed9bd64e47e725fc5ef6c977
      TEST: a_filesystem_that_drops_what_was_not_synced_leaves_each_database_at_its_last_sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: LazyFS, built at its pinned commit
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libfuse3-dev libfuse3-3 fuse3
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          git clone https://github.com/dsrhaslab/lazyfs.git "$RUNNER_TEMP/lazyfs"
          git -C "$RUNNER_TEMP/lazyfs" checkout --detach "$LAZYFS_COMMIT"
          (cd "$RUNNER_TEMP/lazyfs/libs/libpcache" && ./build.sh)
          (cd "$RUNNER_TEMP/lazyfs/lazyfs" && ./build.sh)

      - name: The tests, built before the filesystem is mounted
        run: cargo test -p elmdb --test power_loss --no-run

      - name: LazyFS mounted, and the scripts that drop what wasn't synced, tear a write, and mount it again
        run: |
          fifo="$RUNNER_TEMP/faults.fifo"
          done_fifo="$RUNNER_TEMP/faults-done.fifo"
          mnt="$RUNNER_TEMP/lazyfs.mnt"
          root="$RUNNER_TEMP/lazyfs.root"
          mkdir -p "$mnt" "$root"
          cat > "$RUNNER_TEMP/lazyfs.toml" <<EOF
          [faults]
          fifo_path="$fifo"
          fifo_path_completed="$done_fifo"
          [cache]
          apply_eviction=false
          [cache.simple]
          custom_size="2gb"
          blocks_per_page=1
          [filesystem]
          log_all_operations=false
          logfile=""
          EOF
          # Mounts LazyFS with the config it is given, once whatever was mounted is gone: one that crashed as it tore a
          # write leaves its mount behind it
          cat > "$RUNNER_TEMP/mount.sh" <<EOF
          fusermount3 -uz "$mnt" 2>/dev/null || true
          rm -f "$fifo" "$done_fifo"
          cd "$RUNNER_TEMP/lazyfs/lazyfs"
          nohup ./scripts/mount-lazyfs.sh -c "\$1" -m "$mnt" -r "$root" -f >> "$RUNNER_TEMP/lazyfs.log" 2>&1 &
          for _ in \$(seq 1 60); do mountpoint -q "$mnt" && ls "$mnt" > /dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
          EOF
          sh "$RUNNER_TEMP/mount.sh" "$RUNNER_TEMP/lazyfs.toml"
          # Drops what wasn't synced, waits for LazyFS to say it has, and drops the kernel's copy of what it read, so
          # the next read is LazyFS's
          cat > "$RUNNER_TEMP/lose.sh" <<EOF
          echo "lazyfs::clear-cache" > "$fifo"
          read -r said < "$done_fifo"
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          EOF
          # Mounts LazyFS again told to tear the given write to the given file, named on the mount: split in three, the
          # first part and the last persisted, and LazyFS crashed, as a loss of power in the middle of a write leaves it
          cat > "$RUNNER_TEMP/arm.sh" <<EOF
          file="$root\${1#$mnt}"
          cp "$RUNNER_TEMP/lazyfs.toml" "$RUNNER_TEMP/torn.toml"
          printf '[[injection]]\ntype="torn-op"\nfile="%s"\noccurrence=%s\nparts=3\npersist=[1,3]\n' "\$file" "\$2" >> "$RUNNER_TEMP/torn.toml"
          sh "$RUNNER_TEMP/mount.sh" "$RUNNER_TEMP/torn.toml"
          EOF
          # Mounts LazyFS again as it was, after the tear, the kernel's copy of the files dropped
          cat > "$RUNNER_TEMP/heal.sh" <<EOF
          sh "$RUNNER_TEMP/mount.sh" "$RUNNER_TEMP/lazyfs.toml"
          sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
          EOF

      - name: Each database opens at its writer's last sync
        env:
          ELMDB_LOSSY_DIR: ${{ runner.temp }}/lazyfs.mnt/pinned
          ELMDB_LOSSY_LOSE: ${{ runner.temp }}/lose.sh
        run: |
          mkdir -p "$ELMDB_LOSSY_DIR"
          cargo test -p elmdb --test power_loss -- --ignored --exact "$TEST" --nocapture --test-threads=1

      - name: Without the pin it doesn't, so the test above can fail
        env:
          ELMDB_LOSSY_DIR: ${{ runner.temp }}/lazyfs.mnt/unpinned
          ELMDB_LOSSY_LOSE: ${{ runner.temp }}/lose.sh
          ELMDB_LOSSY_UNPINNED: "1"
        run: |
          mkdir -p "$ELMDB_LOSSY_DIR"
          # Only the failure of the database's check counts: what it held against what its last sync held. Another
          # failure, a writer that never synced or a script that broke, says nothing of the test
          if cargo test -p elmdb --test power_loss -- --ignored --exact "$TEST" --nocapture --test-threads=1 > unpinned.log 2>&1; then
            cat unpinned.log
            echo "::error::the test passed with the writer's pin turned off: it can't tell a torn database from a whole one"
            exit 1
          fi
          cat unpinned.log
          if ! grep -Eq "round [0-9]+, synced at [0-9]+" unpinned.log; then
            echo "::error::the test failed with the pin off, but not at the database's check"
            exit 1
          fi

      - name: A torn write leaves each database at its writer's last sync
        env:
          ELMDB_TORN_DIR: ${{ runner.temp }}/lazyfs.mnt/torn
          ELMDB_TORN_ARM: ${{ runner.temp }}/arm.sh
          ELMDB_TORN_HEAL: ${{ runner.temp }}/heal.sh
          TORN: a_filesystem_that_tears_a_write_leaves_each_database_at_its_last_sync
        run: |
          mkdir -p "$ELMDB_TORN_DIR"
          cargo test -p elmdb --test power_loss -- --ignored --exact "$TORN" --nocapture --test-threads=1

      - name: LazyFS's log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/lazyfs.log" || true
