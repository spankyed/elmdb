# Fails, which mails whoever maintains this, when upstream LMDB has commits nobody here has read (scripts/lmdb-upstream.py)
name: lmdb upstream
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unread:
    runs-on: ubuntu-24.04
    # A fetch of upstream's commits and the fork's one, and cargo's metadata: a few minutes at most
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: python3 scripts/lmdb-upstream.py
        env:
          GH_TOKEN: ${{ github.token }}
