# Targeted Miri and Linux AddressSanitizer / UndefinedBehaviorSanitizer runs: weekly, and on a dispatch.
#
# Miri checks the pure-Rust v2 modules (`elmdb-wire`, `elmdb-storage`, `elmdb-projections`, `elmdb-vec`,
# and sans-I/O `elmdb-invalidation` scheduler) without crossing LMDB or zstd C FFI.
#
# ASan + UBSan instruments both Rust (`-Zsanitizer=address`) and the bundled C libraries (`lmdb-master-sys`,
# `zstd-sys`) across real LMDB transactions, map growth, durability sidecars, compression, and full v2 E2E suites.
name: sanitizers

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri (pure-Rust v2 unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install nightly toolchain with miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: miri
      - name: prepare miri sysroot
        run: cargo +nightly miri setup
      - name: run pure-Rust v2 unit tests under Miri
        run: |
          set -euo pipefail
          run_miri() {
            local pkg="$1"
            shift
            local cargo_args=()
            local test_args=()
            local seen_sep=0
            for arg in "$@"; do
              if [ "$seen_sep" -eq 0 ] && [ "$arg" = "--" ]; then
                seen_sep=1
              elif [ "$seen_sep" -eq 0 ]; then
                cargo_args+=("$arg")
              else
                test_args+=("$arg")
              fi
            done
            local log
            log=$(mktemp)
            cargo +nightly miri test -p "$pkg" "${cargo_args[@]}" -- --color never "${test_args[@]}" 2>&1 | tee "$log"
            # Guard against empty filters silently passing
            grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$log"
            rm -f "$log"
          }
          # Skip proptest! (reads filesystem/env under Miri isolation) and 66k-row bulk stress test
          # (exceeds Miri timeout; `result_encoder_rolls_back_dict_and_body_on_error` covers rollback under Miri).
          run_miri elmdb-wire --lib -- \
            --skip unified_numeric_key_matches_exact_compare_for_all_ints_and_floats \
            --skip result_encoder_exceeds_65535_rows_and_rolls_back_dict_on_error
          run_miri elmdb-storage --lib
          run_miri elmdb-projections --lib
          run_miri elmdb-vec --lib
          run_miri elmdb-invalidation --test invalidation_dst -- --exact sans_io_scheduler_adaptive_gap_turn_slicing_dedup_and_lifecycle

  asan-ubsan:
    name: ASan + UBSan (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Clang matches rustc's LLVM ASan runtime; `-fno-sanitize=alignment` excludes LMDB's intentional
      # 2-byte-aligned `EVEN(n)` pointers in `mdb.c`, and `-fsanitize-trap=undefined` traps C UB
      # immediately without requiring a separate libubsan runtime beside rustc's ASan runtime.
      CC: clang
      RUSTFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address,undefined -fno-sanitize=alignment -fsanitize-trap=undefined -fno-omit-frame-pointer
      # LeakSanitizer reports false positives on Rust's test harness TLS, parking_lot globals, and child-process
      # crash/exit tests that intentionally terminate without running destructors.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      CARGO_TARGET_DIR: target/asan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install nightly toolchain with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: asan-ubsan
      - name: run FFI, LMDB, durability, compression, and E2E suites under ASan + UBSan
        run: |
          set -euo pipefail
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p elmdb-storage \
            -p elmdb-lmdb \
            -p elmdb-projections \
            -p elmdb-engine \
            -p elmdb \
            --lib --tests -- --color never
