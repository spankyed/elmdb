# The code the Shuttle models hold, mutated and tested against those models, which the pull request's mutation gate
# (mutants.yml) doesn't run: weekly, and on a dispatch. It gates nothing. Where a model lets a mutant through, the run
# fails and the issue labelled `mutants-model` lists it, opened or brought up to date; a run that catches them all
# closes that issue (scripts/mutants-models.py, docs/architecture/testing.md, Mutation testing).
#
#   gh workflow run model-mutants.yml                 # every model
#   gh workflow run model-mutants.yml -f model=builder
#
# A model's mutants take a release build each, a minute or two on a runner, and its cases a few seconds each at the
# schedules asked for: about a hundred mutants in the builder's file, so each model has a job of its own
name: model mutants

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "One model (builder, call_reads, unit_slot, watch), or all where empty"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: model-mutants
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: model mutants (${{ matrix.model }})
    strategy:
      fail-fast: false
      matrix:
        model: [builder, call_reads, unit_slot, watch]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.model == '' || inputs.model == matrix.model
      - if: inputs.model == '' || inputs.model == matrix.model
        run: rustup show active-toolchain
      - if: inputs.model == '' || inputs.model == matrix.model
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: inputs.model == '' || inputs.model == matrix.model
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - if: inputs.model == '' || inputs.model == matrix.model
        run: python3 scripts/mutants-models.py ${{ matrix.model }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (inputs.model == '' || inputs.model == matrix.model)
        with:
          name: model-mutants-${{ matrix.model }}
          path: target/mutants-models
          if-no-files-found: ignore

  # One issue for every model's survivors: opened or brought up to date where any survived, closed where none did. A
  # dispatch for one model reports on that model alone, and leaves the issue as it is
  report:
    name: model mutants' issue
    needs: mutants
    if: always() && !cancelled() && inputs.model == ''
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: model-mutants-*
          path: reports
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.mutants.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          open=$(gh issue list --label mutants-model --state open --json number -q '.[0].number')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Every mutant of the modelled code was caught: $RUN"
            fi
            exit 0
          fi
          {
            echo "The weekly run of the Shuttle models over the code they hold let these mutants through: $RUN"
            echo
            for report in reports/model-mutants-*/report.md; do
              [ -f "$report" ] && sed '1,2d' "$report" && echo
            done
            echo "A job that failed with no report here ended for another reason; its log is in the run."
          } > body.md
          gh label create mutants-model --color B60205 --description "Mutants the Shuttle models don't catch" 2>/dev/null || true
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file body.md
            gh issue comment "$open" --body "Run again: $RUN"
          else
            gh issue create --label mutants-model --title "Mutants the Shuttle models don't catch" --body-file body.md
          fi
