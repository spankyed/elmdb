# Concurrency models with deeper bounds than a pull request's run: Loom one preemption further
# (`LOOM_MAX_PREEMPTIONS=4`), Shuttle a hundred times the schedules (`10_000_000`) across all four
# v2 models (`docs/architecture/testing.md`, Concurrency models).
name: models

on:
  # schedule:
  #   - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loom:
    name: concurrency models, deep (Loom)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 4
      CARGO_TARGET_DIR: target/loom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p elmdb-storage --release --lib locks::model
      - run: cargo test -p elmdb --release --lib db::lifecycle_model

  shuttle:
    name: concurrency models, deep (Shuttle)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTFLAGS: --cfg shuttle
      CARGO_TARGET_DIR: target/shuttle
      ELMDB_SHUTTLE_ITERATIONS: "10000000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p elmdb-storage --release --lib locks::model
      - run: cargo test -p elmdb-sim --release --lib durability_model
      - run: cargo test -p elmdb --release --lib db::lifecycle_model
      - run: cargo test -p elmdb-invalidation --release --lib model
