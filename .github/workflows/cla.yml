name: CLA

# **Every contributor other than the maintainer signs elmdb's Contributor License Agreement (`CLA.md`) once**, by
# posting its sentence in a pull request; this workflow records the signature and reports `CLAAssistant`, which fails
# while an author of the pull request's commits hasn't signed. `CONTRIBUTING.md` is what a contributor reads.
#
# It runs on `pull_request_target`, in the base repository with a token that can write, so that it can record a
# signature from a fork's pull request. It checks out nothing and runs none of the pull request's code: what it reads
# is the pull request's commit authors and comments, through the API.
#
# Signatures are kept in `signatures/version1/cla.json` on the `cla-signatures` branch, which no branch protection
# covers: the action commits to it. The first run makes the branch from `main` when it isn't there. A new version of
# CLA.md, one that asks every contributor to sign again, takes a new file (`version2/…`).
#
# A corporation signs `CLA-CORPORATE.md` off GitHub. Its Designated Employees' accounts are then listed in
# `.github/cla-corporate.json`, read from `main` on each run and added to the allowlist, so they don't sign one by one.
#
# The action, contributor-assistant/github-action, is archived and read-only since 2026: v2.6.1 is pinned by its
# commit, and it declares Node 20, which GitHub runs on Node 24.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

permissions:
  # Required by contributor-assistant/github-action to re-run the pull_request_target check after a signature or recheck comment
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  CLAAssistant:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'recheck') ||
         contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Comment is a CLA signature or recheck
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = pull_request_target ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          trimmed=$(python3 -c 'import os; print(os.environ.get("COMMENT_BODY", "").strip())')
          if [ "$trimmed" = "recheck" ] || [ "$trimmed" = "I have read the CLA Document and I hereby sign the CLA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The signatures' branch is there
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/branches/cla-signatures" > /dev/null 2> branch.err; then exit 0; fi
          if ! grep -q 'Branch not found' branch.err; then
            cat branch.err
            exit 1
          fi
          main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GH_REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$main" > /dev/null
          echo "made cla-signatures from main at $main"
      # Read from main, not from the pull request, which could otherwise list its own author
      - name: The accounts a corporate agreement covers
        if: steps.check.outputs.run == 'true'
        id: corporate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          accounts=$(gh api "repos/$GH_REPO/contents/.github/cla-corporate.json?ref=main" --jq .content | base64 -d \
            | jq -r '[.corporations[].accounts[]] | join(",")')
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"
          echo "covered by a corporate agreement: ${accounts:-none}"
      - name: CLA Assistant
        if: steps.check.outputs.run == 'true'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/spankyed/elmdb/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer, who holds the copyright; bots, which can't sign; and the accounts a corporate agreement covers
          allowlist: spankyed,*[bot]${{ steps.corporate.outputs.accounts && format(',{0}', steps.corporate.outputs.accounts) || '' }}
          create-file-commit-message: 'chore(cla): the file that records CLA signatures'
          signed-commit-message: 'chore(cla): $contributorName signed the CLA in $owner/$repo#$pullRequestNo'
