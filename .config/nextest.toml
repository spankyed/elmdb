# Each test runs in its own process, so a test that hangs is killed at its deadline and the rest run on.

# What CI installs, and the oldest that reads this file as written
nextest-version = "0.9.148"

[profile.default]
# Every test but the model harness ends within a minute or two on CI's slowest runner, Intel macOS
slow-timeout = { period = "60s", terminate-after = 4 }

# The model harness: about a minute on an Apple-silicon laptop, and four to five on CI's Intel macOS runner
[[profile.default.overrides]]
filter = "test(=engine::tests::model::the_engine_holds_what_the_model_holds_after_every_step)"
slow-timeout = { period = "60s", terminate-after = 15 }

# A watch callback that closes, unwatches or delivers again from inside a delivery deadlocks when it regresses
[[profile.default.overrides]]
filter = "test(/^engine::tests::tracked::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Reader saturation children must reach their barrier or fail promptly, never hang a job.
[[profile.default.overrides]]
filter = "test(/^store::tests::(a_read_refuses_live_reader|a_read_only_open_recovers|reader_recovery_)/)"
slow-timeout = { period = "10s", terminate-after = 2 }

# A graph walk that stops expanding or revisits entities never ends: each of these tests takes under a second
[[profile.default.overrides]]
filter = "test(/^engine::tests::graph::/)"
slow-timeout = { period = "10s", terminate-after = 2 }

# A rank index's drain that never reaches its bound never ends, and a test waiting for the index's build waits with it:
# each of these tests takes about 2 s on an Apple-silicon laptop (2026-11-01), so a hang ends at 20 s rather than at
# the run's whole deadline, which a mutation run's timeout sets at about three times the clean suite
[[profile.default.overrides]]
filter = "test(/^engine::tests::rank_index::/)"
slow-timeout = { period = "10s", terminate-after = 2 }

# Idle-reader child barriers and expiry must fail promptly if the cache worker stops releasing snapshots.
[[profile.default.overrides]]
filter = "test(/^store::(retention_tests|idle_reads)::/)"
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.ci]
fail-fast = false
