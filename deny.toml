# cargo-deny: the RustSec advisories, the crates banned or built twice, and where a crate may come from, for the whole
# workspace (`docs/architecture/testing.md`, Platforms). Run as
#
#     cargo deny check bans sources advisories
#
# always naming the checks. There is no [licenses] section: `crates/elmdb-node/about.toml` is the one license policy,
# which `cargo xtask check-notices` holds, and it carries clarifications this file would have to copy. So a bare
# `cargo deny check` runs the license check with nothing accepted, and fails on every crate.

# The targets the npm package ships for, `napi.targets` in `crates/elmdb-node/package.json`: a crate no target builds
# is not read
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

# Every advisory fails, a crate marked unmaintained included, wherever in the tree it is. An advisory is answered by
# removing the crate where that can be done. Where it can't, `ignore` gains an entry with the advisory's id and, as
# its `reason`, why the crate stays; cargo-deny warns of an entry that matches nothing, so none outlives its crate
[advisories]
ignore = []

# Nothing is banned by name. A crate built at more than one version warns and doesn't fail: most come from the
# dependencies' own requirements
[bans]
multiple-versions = "warn"

# crates.io and nothing else: no other registry and no git repository
[sources]
unknown-registry = "deny"
unknown-git = "deny"
