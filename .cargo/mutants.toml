# cargo-mutants: what it mutates and how it tests each mutant. A run is scoped by `--file` or `--in-diff`, never the
# whole crate (`docs/architecture/testing.md`, Mutation testing, has the commands and the two passes).

# The tests themselves, and code no spec of the engine's covers by design
exclude_globs = [
    "crates/elmdb/src/**/tests/**",
    "crates/elmdb/src/**/tests.rs",
    "crates/elmdb/benches/**",
    "crates/elmdb/examples/**",
    "xtask/**",
    # Built only with --cfg loom or --cfg shuttle, which no suite cargo-mutants runs is: the models and what they run on
    # (`docs/architecture/testing.md`, Concurrency models)
    "crates/elmdb/src/sync/model.rs",
    "crates/elmdb/src/sync/shuttle_primitives.rs",
    "crates/elmdb/src/engine/watch/model.rs",
    "crates/elmdb/src/engine/builder/model.rs",
]
# A mutant of the engine is tested by the engine's suite, which the binding's and the CLI's add nothing to
test_package = ["elmdb"]
# Each test in its own process under `.config/nextest.toml`'s deadlines, so a mutant that hangs one is caught at it
test_tool = "nextest"
# Under the machine's other load a suite can run several times its baseline
timeout_multiplier = 3.0
# Inside target/, which is gitignored and which cargo-mutants doesn't copy
output = "target"
# Without debug info (`Cargo.toml`, profile.mutants): each job's copy is a fraction of a debug build's
profile = "mutants"

# Mutants that answer exactly what the code answers, each with why (`docs/evidence/verification-tooling.md`)
exclude_re = [
    # The block a trigram's place is filed under is layout: the writes, the builds and check() all ask block_of, so any
    # function of the place answers the same, and only the file's size and a write's cost tell them apart
    "trigram.rs:.*replace block_of -> u64 with",
    # unique_keys' arms for one field absent and one field held each give what its general arm gives those inputs
    "entities.rs:.*delete match arm \\[None\\] in unique_keys",
    "entities.rs:.*delete match arm \\[Some\\(v\\)\\] in unique_keys",
    # check_unique's index read skips the entity's own entry; a unique index holds one entity a value, so stopping
    # at the first entry or the one after it finds the same holder
    "entities.rs:351:.*replace == with != in check_unique",
    # stored's check that a frame is smaller than the msgpack it holds: moved by a byte, it keeps or drops a frame
    # within a byte of the msgpack's length, which decodes to the same value. Anchored by line, the same operator
    # being the threshold's on the line above; a line moved can hide a mutant of the same kind that lands here, which
    # the `--list --no-config` diff (`docs/architecture/testing.md`, Mutation testing) shows
    "values.rs:42:.*replace (< with <=|\\+ with -|\\+ with \\*) in stored",
    # parse's field name needs an alphabetic first character, which an empty name (name_end == at) doesn't have
    "search.rs:66:.*replace > with >= in parse",
    # within's guard: the DFA is built for the distance within asks, and reports Exact only up to its own maximum
    "search.rs:.*replace match guard d <= distance with true in within",
    # A word given no edits walks an exact DFA, whose only match, at distance 0, the loop skips
    "search.rs:310:.*replace > with >= in expand",
    "search.rs:592:.*replace > with >= in suggest",
    # The exact term was merged at weight 1 first, and merge keeps a term's highest weight
    "search.rs:313:.*replace > with >= in expand",
    # A clause of several words is checked by holds, which needs every word at consecutive places, so the union of the
    # words' postings keeps what their intersection keeps; and holds answers true for one word in any field
    "search.rs:422:.*replace &= with \\|= in search",
    "search.rs:427:.*replace > with >= in search",
    # walk_type merges the trash into the live range by place, and no two entities share a place
    "reads.rs:.*replace < with <= in Query<'_, R>::walk_type",
    # nearest's first ask: it asks again, four times as many, while what it admitted is short of k and the graph held
    # more, so any first ask finds the same k
    "reads.rs:1186:.*replace \\+ with \\* in Query<'_, R>::nearest",
    # orderBy then limit through first_ordered, or the full sort and the first n: the same ids in the same order, and
    # EXPLAIN's counts the same, the limit stopping the walk; first_ordered's cut and bound are its cost
    "reads.rs:893:.*replace > with < in Query<'_, R>::stage",
    "reads.rs:894:.*replace - with / in Query<'_, R>::stage",
    "reads.rs:1388:.*replace >= with < in Query<'_, R>::first_ordered",
    "reads.rs:1390:.*replace == with != in Query<'_, R>::first_ordered",
    # A stage's answer flows only to the stages after it and the terminal, none of which reads it: an id refused is
    # what stops a walk
    "reads.rs:915:.*delete ! in Query<'_, R>::stage",
    # The value spec refuses every extension but the timestamp, and every number that isn't finite, so no stored value
    # reaches these guards' other side
    "reads.rs:.*replace match guard \\*t == TIMESTAMP_EXTENSION with true in sort_key",
    "reads.rs:.*replace match guard n.is_finite\\(\\) with true in json_text",
    # check_stamp's newer-format arm: the format equal to this elmdb's is the arm above it
    "store/mod.rs:.*replace > with >= in check_stamp",
    # The worker's owed check: a sync is due only after a commit since the last sync began, so whenever one is due the
    # commits outnumber the synced
    "sync.rs:330:.*replace > with >= in run",
    # A manual clock's worker would wait a millisecond at a time rather than to be woken: the same syncs, polled
    "sync.rs:343:.*replace match guard !shared.clock.is_manual\\(\\) with true in run",
    # A build error other than a refusal recurs in the fallback's walk of the same rows, which returns it
    "derive.rs:.*replace match guard matches!\\(e.code, ErrorCode::Unique \\| ErrorCode::ValueInvalid\\) with true in rebuild",
    # The spill budget sets when rows go to disk, which no answer shows; the release heap test
    # (tests/maintenance_heap.rs) holds what it bounds
    "sorted.rs:12:.*replace \\* with",
    # buildable_entry's own-entry skip: index_parts files each of an entity's values once, so an entity never meets its
    # own entry under one key
    "derive.rs:.*replace match guard \\*other != id with true in buildable_entry",
    # begin's growth when more than half the map is used: at exactly half, growing or not is a page's difference
    "store/mod.rs:.*replace > with >= in Store::begin",
    # build_chunk's unique check skips the entity's own entry: a write checks a unique value against the rows while the
    # index is unbuilt, so an entity's own entry and another's for the same value are never both in the index
    "derive.rs:594:.*replace == with != in build_chunk",
    # move_file's temporary-attribute check: clearing an attribute a file doesn't have sets the attributes it has
    "backup.rs:101:.*replace & with \\| in move_file",
    # Disjoint flag bits, which | and ^ join alike: MoveFileExW's replace and write-through, GetModuleHandleExW's
    # from-address and pin
    "backup.rs:.*replace \\| with \\^ in move_file",
    "process.rs:.*replace \\| with \\^ in pin_module",
    # claim's conversion to a napi error, and pin_module (Windows), which keeps a claim alive after its first worker:
    # each needs Node, and the binding's own suite holds them (`test/process.test.mjs`: a refusal answered as
    # `ALREADY_LOADED`, and a claim outliving its first worker), which cargo-mutants doesn't run
    "process.rs:.*replace claim -> ",
    "process.rs:.*replace pin_module -> ",
    # The binding's diagnostics experiment: installing elmdb's collector for the process and taking from it, each a call
    # of elmdb's tested Collector that needs Node, which `examples/diagnostics.mjs` runs and cargo-mutants doesn't
    "elmdb-node/src/diagnostics.rs:.*replace (collect_diagnostics|take_diagnostics) -> ",
    # A stored value streamed, which every one is with the guard false or the one-call size made 0: the stream
    # decompresses the same bytes, so only what a read costs tells them apart (`benches/reads.rs`)
    "values.rs:.*replace match guard size <= ONE_CALL_UP_TO with false in decompress",
    "values.rs:69:.*replace << with >>",
    # rank's stop: a round whose scores moved by exactly the tolerance stops, or runs one more round that moves them
    # less; the two differ only where an L1 sum of floats lands on the tolerance to the bit
    "algorithms.rs:.*replace < with <= in rank",
    # project's fast path: a start of distinct types hands each entity on once and no step hands one on twice, so
    # dropping repeats from a set that holds none answers the same, at the cost of marking every id
    "reads.rs:.*replace == with != in Query<'_, R>::holds_each_once",
    "reads.rs:.*delete ! in Query<'_, R>::holds_each_once",
    # The rank index (`docs/roadmap/rank-index.md`). How the builder's chunks commit: logging narrows which watches run
    # again, and a watch delivers only an answer that changed, so a commit that logs nothing tells every watch and each
    # hears the same
    "engine/mod.rs:75:.*delete ! in drain_commits",
    # When a drain starts: a pause for commits to stop leaving pushes, which only a drain's cost shows (the bench); that
    # it waits for one is the builder's Shuttle model (`engine/builder/model.rs`), which no suite cargo-mutants runs builds
    "builder.rs:.*in Core::await_quiet",
    # Which waiting node a commit pushes, or whether the commit or the drain pushes it: both follow one sweep kept in
    # the totals, so the same nodes are pushed in the same order (`draining_in_chunks_makes_the_bits_one_drain_makes`),
    # and the queue `finish` writes is counted from each node's residual, not from what was waiting
    "ranks.rs:286:.*in Change<'i, 'a>::get",
    "ranks.rs:301:.*replace > with >= in Change<'i, 'a>::set",
    "ranks.rs:619:.*replace match guard after.is_some\\(\\) with (true|false) in push",
    "ranks.rs:627:.*replace > with >= in push",
    # A node whose arcs weighed nothing takes an arc of weight 0 or doesn't, which carries nothing either way; its
    # out-weight is counted again from its arcs when the subtraction leaves too little to trust, and counting it again
    # more or less often answers the same arcs; a node left with no out-weight keeps its estimate or hands it to its
    # residual, and both hold the invariant
    "ranks.rs:401:.*replace > with >= in Change<'i, 'a>::reweigh_arc",
    "ranks.rs:405:.*replace \\* with (\\+|/) in Change<'i, 'a>::reweigh_arc",
    "ranks.rs:408:.*replace > with >= in Change<'i, 'a>::reweigh_arc",
    # finish's shortcut: nothing changed, so nothing to write; the totals change only with a node, whose writes put
    # them too
    "ranks.rs:514:.*replace == with != in Change<'i, 'a>::finish",
    # A residual exactly at the threshold, or a bound exactly at the tolerance: a double the writes never land on
    "ranks.rs:(527|537):.*replace > with >= in Change<'i, 'a>::finish",
    "ranks.rs:(703|743):.*replace (>|<) with (>=|<=) in drain",
    "ranks.rs:881:.*replace > with >= in unfinished",
    # The drain's loop control, its running sum of the residuals and its count of nodes passed since a push, only decides
    # when it stops: what it reports waiting, and the totals settle writes, are counted again from the nodes, and a
    # drain stopped early is drained again from its sweep
    "ranks.rs:703:.*replace < with <= in drain",
    "ranks.rs:(710|721):.*replace \\+= with (\\*=|-=) in drain",
    # check()'s tolerances for rounding: a clean index holds its sums within them by far, and the damage the tests make
    # moves a value far past them, so a tolerance off by a factor answers the same
    "ranks.rs:(955|967|988|1005|1006):.*in violations",
    # check()'s comparison with `rank`: every state the invariant holds in is within the bound it reports (the bound's
    # proof, `docs/evidence/rank-index.md`), so it fires only for a wrong system or a wrong bound, which the invariant
    # checks above it catch first
    "ranks.rs:(1017|1028):.*in violations",
]
