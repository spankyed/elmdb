# cargo-mutants: what it mutates and how it tests each mutant. A run is scoped by `--file` or `--in-diff`, never the
# whole workspace (`docs/architecture/testing.md`, Mutation testing, has the commands and the two passes).

# The tests themselves, benches, examples, tooling, and pure N-API JS-boundary glue
exclude_globs = [
    "crates/*/src/**/tests/**",
    "crates/*/src/**/tests.rs",
    "crates/*/tests/**",
    "crates/*/benches/**",
    "crates/*/examples/**",
    "xtask/**",
    # The binding's exports and the conversions they make for JavaScript: only JavaScript reaches them, its suite
    # (`crates/elmdb-node/test/`, `npm test`) holds them, and cargo-mutants runs no JavaScript, so no mutant of this file
    # is ever caught here. The binding's other files, which their own Rust tests reach, keep their mutants
    "crates/elmdb-node/src/lib.rs",
    # The pool's jobs: each runs when a promise is made by JavaScript, which only the binding's suite calls
    # (`test/offthread.test.mjs`)
    "crates/elmdb-node/src/jobs.rs",
]
# Each test in its own process under `.config/nextest.toml`'s deadlines, so a mutant that hangs one is caught at it
test_tool = "nextest"
# Under the machine's other load a suite can run several times its baseline
timeout_multiplier = 3.0
# Inside target/, which is gitignored and which cargo-mutants doesn't copy
output = "target"
# Without debug info (`Cargo.toml`, profile.mutants): each job's copy is a fraction of a debug build's
profile = "mutants"

# Mutants that answer exactly what the code answers or are only reachable from Node.js (`docs/evidence/verification-tooling.md`).
# These name no line. A mutant excused on its line is named by a `// mutant-skip:` comment above that line and nowhere here,
# so a run reads `--config "$(cargo xtask mutant-exclusions)"`: this file with a pattern for each of those comments,
# written to target/ and never committed (`docs/architecture/testing.md`, Mutation testing)
exclude_re = [
    # Disjoint flag bits, which | and ^ join alike: GetModuleHandleExW's from-address and pin
    "process.rs:.*replace \\| with \\^ in pin_module",
    # claim's conversion to a napi error, and pin_module (Windows), which keeps a claim alive after its first worker:
    # each needs Node, and the binding's own suite holds them (`test/process.test.mjs`: a refusal answered as
    # `ALREADY_LOADED`, and a claim outliving its first worker), which cargo-mutants doesn't run
    "process.rs:.*replace claim -> ",
    "process.rs:.*replace pin_module -> ",
    # The binding's diagnostics experiment: installing elmdb's collector for the process and taking from it, each a call
    # of elmdb's tested Collector that needs Node, which `examples/diagnostics.mjs` runs and cargo-mutants doesn't
    "elmdb-node/src/diagnostics.rs:.*replace (collect_diagnostics|take_diagnostics) -> ",
    # The panic a test asks an export for, by a variable of the process read once: `test/panics.test.mjs` starts a
    # process for each export to hold it, and no test of this process can ask twice
    "elmdb-node/src/panics.rs:.* in asked_for",
    "elmdb-node/src/panics.rs:.*replace asked_for with ",
    # The closes made as an environment or the process ends, which only a Node process that ends reaches:
    # `test/exit.test.mjs` holds them, by the semaphores a database left open would leave
    "elmdb-node/src/exit.rs:.*replace (close_at_process_exit|close_at_exit|opened) ",
    # An export's answer made of a caught panic: a napi error, which a test binary can't link the dropping of
    # without Node (`napi_delete_reference`). `test/panics.test.mjs` holds each through every export
    "elmdb-node/src/panics.rs:.*replace (guarded|Health::guarded|Health::unrefused) -> ",
]
