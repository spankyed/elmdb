[package]
name = "elmdb"
description = "Embedded entity-relation database on LMDB: schema'd entities and relations, value, text and vector indexes in the data's own transaction, and change sets for live reads"
keywords = ["database", "embedded", "lmdb", "vector-search", "full-text-search"]
categories = ["database-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The protocol's TypeScript declarations and the schema's JSON Schema, generated by `cargo xtask generate`
codegen = ["dep:ts-rs", "dep:schemars"]

[dependencies]
heed.workspace = true
rmpv.workspace = true
rmp.workspace = true
rmp-serde.workspace = true
getrandom.workspace = true
icu_collator.workspace = true
icu_locale_core.workspace = true
# A number in a sort key written as ECMAScript's Number::toString writes it, as `JSON.stringify` does
ryu-js.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
# Named failpoints, which only the tests' builds enable (`src/failpoints.rs`)
fail.workspace = true
# Text indexes (`docs/architecture/search.md`): tokenizing and normalizing, the posting lists, fuzzy terms, and stemming
charabia.workspace = true
roaring.workspace = true
regex.workspace = true
regex-syntax.workspace = true
zstd.workspace = true
levenshtein_automata.workspace = true
rust-stemmers.workspace = true
# Vector indexes: hannoy's HNSW graphs in the same environment, built with a seeded generator
hannoy.workspace = true
rand.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# On macOS LMDB locks with System V semaphore sets, keyed by `ftok` of the lock file's inode: 16 of its bits, so a set an
# unrelated environment left (or holds) can share a key, and one LMDB build's set of another size refuses to open
# (`EINVAL`). POSIX semaphores are named from the lock file's whole device and inode, and a stale one is removed by the
# environment's first opener. Linux and Windows keep LMDB's robust mutexes
[target.'cfg(target_os = "macos")'.dependencies]
heed = { workspace = true, features = ["posix-sem"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
fail = { workspace = true, features = ["failpoints"] }
proptest.workspace = true
proptest-state-machine.workspace = true
criterion.workspace = true
dhat.workspace = true

# Instruction counts run under Valgrind, which runs on Linux (`benches/instructions.rs`)
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun.workspace = true

# The concurrency models, built with `--cfg loom` or `--cfg shuttle` (`src/sync/`)
[target.'cfg(loom)'.dependencies]
loom.workspace = true

[target.'cfg(shuttle)'.dependencies]
shuttle.workspace = true

[lints]
workspace = true

[[bench]]
name = "maintenance"
harness = false

[[bench]]
name = "reads"
harness = false

[[bench]]
name = "instructions"
harness = false
