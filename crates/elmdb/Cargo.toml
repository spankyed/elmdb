[package]
name = "elmdb"
description = "Embedded database for Node.js and Electron: typed entities and relations, full-text/fuzzy/vector search, graph analytics, and live queries on LMDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
codegen = ["dep:ts-rs", "dep:schemars"]
diagnostics = ["dep:tracing"]
failpoints = ["elmdb-storage/failpoints", "elmdb-lmdb/failpoints"]

[dependencies]
elmdb-storage.workspace = true
elmdb-lmdb.workspace = true
elmdb-wire.workspace = true
elmdb-engine.workspace = true
elmdb-projections.workspace = true
elmdb-vec.workspace = true
elmdb-query.workspace = true
elmdb-invalidation.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Exact-pinned index/collator dependencies held for downstream consumers (`cargo xtask check-exact`).
charabia.workspace = true
finl_unicode.workspace = true
rust-stemmers.workspace = true
unicode-normalization.workspace = true
whatlang.workspace = true
icu_collator.workspace = true
icu_collator_data.workspace = true
icu_collections.workspace = true
icu_locale_core.workspace = true
icu_locale_fallback.workspace = true
icu_locale_fallback_data.workspace = true
icu_normalizer.workspace = true
icu_normalizer_data.workspace = true
icu_properties.workspace = true
icu_properties_data.workspace = true
icu_provider.workspace = true

[dev-dependencies]
elmdb-sim.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
tempfile.workspace = true

[lints]
workspace = true
