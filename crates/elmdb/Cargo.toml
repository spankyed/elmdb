[package]
name = "elmdb"
description = "An embedded graph database written in Rust on LMDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The protocol's TypeScript declarations and the schema's JSON Schema, generated by `cargo xtask generate`
codegen = ["dep:ts-rs", "dep:schemars"]

[dependencies]
heed.workspace = true
rmpv.workspace = true
rmp.workspace = true
rmp-serde.workspace = true
getrandom.workspace = true
icu_collator.workspace = true
icu_locale_core.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Text indexes (`docs/architecture/search.md`): tokenizing and normalizing, the posting lists, fuzzy terms, and stemming
charabia.workspace = true
roaring.workspace = true
levenshtein_automata.workspace = true
rust-stemmers.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# On macOS LMDB locks with System V semaphore sets, keyed by `ftok` of the lock file's inode: 16 of its bits, so a set an
# unrelated environment left (or holds) can share a key, and one LMDB build's set of another size refuses to open
# (`EINVAL`). POSIX semaphores are named from the lock file's whole device and inode, and a stale one is removed by the
# environment's first opener. Linux and Windows keep LMDB's robust mutexes
[target.'cfg(target_os = "macos")'.dependencies]
heed = { workspace = true, features = ["posix-sem"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
