# cargo-about's configuration for THIRD-PARTY-NOTICES, the licenses and notices of the crates the npm package's .node
# files are built from. `cargo xtask notices` writes the file and `cargo xtask check-notices` fails when it is stale;
# both pass the targets from package.json's `napi.targets`, so a dependency only one platform builds is listed. The
# default features are the ones read: the package is built with them.

# The licenses any dependency may be under, in the order one is chosen from a choice such as `MIT OR Apache-2.0`. A
# dependency under another fails the notices, so its license is read before it ships; a license only one crate needs is
# accepted for that crate alone, below.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016"]

# Build scripts and tests run on the machine that builds the package; nothing of theirs is in a .node file
ignore-build-dependencies = true
ignore-dev-dependencies = true

# A clarification names what a crate's declared license leaves out, each file held to its checksum: a new version
# whose file differs fails the notices, and `notices` with it, until the clarification is read again. A checksum covers
# its file, or the part of it between `start` and `end`; it says nothing of the crate's other files.

# lmdb-master-sys declares Apache-2.0, its Rust bindings' license, but compiles LMDB's mdb.c and midl.c into the
# binary too: they are under the OpenLDAP Public License, with LMDB's copyright statements, and mdb.c holds code derived
# from Martin Hedenfalk's btree.c under ISC.
[lmdb-master-sys]
accepted = ["OLDAP-2.8"]

[lmdb-master-sys.clarify]
license = "Apache-2.0 AND OLDAP-2.8 AND ISC"

[[lmdb-master-sys.clarify.files]]
path = "lmdb/libraries/liblmdb/LICENSE"
license = "OLDAP-2.8"
checksum = "310fe25c858a9515fc8c8d7d1f24a67c9496f84a91e0a0e41ea9975b1371e569"

[[lmdb-master-sys.clarify.files]]
path = "lmdb/libraries/liblmdb/COPYRIGHT"
license = "OLDAP-2.8"
checksum = "3c87f63656b6a12fda225b6f798c547fe89e3404f499e890b445761eb310fd4f"

[[lmdb-master-sys.clarify.files]]
path = "lmdb/libraries/liblmdb/midl.c"
license = "OLDAP-2.8"
start = "Copyright 2000-2021 The OpenLDAP Foundation."
end = "All rights reserved."
checksum = "16c89becc1889c8c24a5a0b1e1e795ff83ec4e188720b1a15e0f9c99d465adae"

[[lmdb-master-sys.clarify.files]]
path = "lmdb/libraries/liblmdb/mdb.c"
license = "ISC"
start = "Copyright (c) 2009, 2010 Martin Hedenfalk"
end = "PERFORMANCE OF THIS SOFTWARE."
checksum = "e302571743666b83ea2722bf903e47d17363a011010981a8aa1f5a4078dca6b7"

