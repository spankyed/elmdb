[workspace]
resolver = "3"
members = [
    "crates/elmdb",
    "crates/elmdb-storage",
    "crates/elmdb-sim",
    "crates/elmdb-lmdb",
    "crates/elmdb-wire",
    "crates/elmdb-engine",
    "crates/elmdb-projections",
    "crates/elmdb-vec",
    "crates/elmdb-query",
    "crates/elmdb-invalidation",
    "crates/elmdb-node",
    "crates/elmdb-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spankyed/elmdb"

[workspace.dependencies]
libc = "0.2.191"
windows-sys = "0.61.2"
elmdb = { path = "crates/elmdb" }
elmdb-storage = { path = "crates/elmdb-storage" }
elmdb-sim = { path = "crates/elmdb-sim" }
elmdb-lmdb = { path = "crates/elmdb-lmdb" }
elmdb-wire = { path = "crates/elmdb-wire" }
elmdb-engine = { path = "crates/elmdb-engine" }
elmdb-projections = { path = "crates/elmdb-projections" }
elmdb-vec = { path = "crates/elmdb-vec" }
elmdb-query = { path = "crates/elmdb-query" }
elmdb-invalidation = { path = "crates/elmdb-invalidation" }
lmdb-master-sys = "0.2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
# The collator, and every crate its code and data are, each required exactly: a sort key is the collator's output, and
# stored ones are stale under any other version (`engine/order.rs`, the stamp). Those the engine names nothing of are
# dependencies only to hold their versions, which `cargo xtask check-exact` holds to the lockfile.
# `unstable` is the sink a sort key is cut by as it is made
icu_collator = { version = "=2.4.0", features = ["unstable"] }
icu_collator_data = { version = "=2.4.0", default-features = false }
icu_collections = { version = "=2.4.0", default-features = false }
icu_locale_core = "=2.4.0"
icu_locale_fallback = { version = "=2.4.0", default-features = false }
icu_locale_fallback_data = { version = "=2.4.0", default-features = false }
icu_normalizer = { version = "=2.4.0", default-features = false }
icu_normalizer_data = { version = "=2.4.0", default-features = false }
icu_properties = { version = "=2.4.0", default-features = false }
icu_properties_data = { version = "=2.4.0", default-features = false }
icu_provider = { version = "=2.4.0", default-features = false }
parking_lot = { version = "0.13.0", features = ["arc_lock"] }
proptest = "1.12.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"
schemars = "1.2.3"
tempfile = "3.27.0"
regex = "1.13.1"
regex-syntax = "0.8.11"
zstd = "0.14.3"
clap = { version = "4.6.7", features = ["derive"] }
napi = { version = "3.15.0", default-features = false, features = ["napi9", "serde-json"] }
process_path = "0.1.4"
napi-derive = "3.6.13"
napi-build = "2.6.0"
# What a text index stores is charabia's tokens and rust-stemmers' stems:
# each required exactly, as the collator is, so no build reads an index another version made (`cargo xtask check-exact`)
charabia = { version = "=0.10.0", default-features = false, features = ["latin-camelcase", "latin-snakecase"] }
roaring = "0.11.5"
levenshtein_automata = "0.2.1"
rust-stemmers = "=1.2.0"
# What charabia normalizes, detects a language and segments by, which it requires as ranges: dependencies of elmdb
# only to hold their versions, as the collator's crates are
unicode-normalization = "=0.1.26"
whatlang = "=0.18.0"
finl_unicode = "=1.5.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
leiden-rs = { version = "=0.8.1", default-features = false }
libm = "=0.2.16"
rustc-hash = "=2.1.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# What cargo-mutants builds each mutant with (`.cargo/mutants.toml`): the test profile without debug info, which is most
# of what each of its copies of the tree takes on disk
# Backtraces and panics keep their files and lines; a debugger's view of locals takes CARGO_PROFILE_DEV_DEBUG=full for
# that build. Each artifact is smaller and links sooner: the workspace's tests built 1.9 GB in 37 s with full debug
# info, 1.6 GB in 33 s with this (2026-10-31, Apple M1 Pro, `cargo test --workspace --all-targets --no-run` into an
# empty build directory each, a load average about 8)
[profile.dev]
debug = "line-tables-only"

[profile.mutants]
inherits = "test"
debug = 0

[profile.release]
lto = true
codegen-units = 1

# The release build with line tables, so a native profiler names Rust functions and lines (`docs/architecture/testing.md`)
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
