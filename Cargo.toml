[workspace]
resolver = "3"
members = ["crates/elmdb", "crates/elmdb-node", "crates/elmdb-cli", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spankyed/elmdb"

[workspace.dependencies]
elmdb = { path = "crates/elmdb" }
heed = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
getrandom = "0.4.3"
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
parking_lot = { version = "0.13.0", features = ["arc_lock"] }
rmp = "0.8.15"
proptest = "1.12.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"
schemars = "1.2.3"
tempfile = "3.27.0"
napi = { version = "3.15.0", default-features = false, features = ["napi9", "serde-json"] }
process_path = "0.1.4"
napi-derive = "3.6.13"
napi-build = "2.6.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
